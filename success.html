<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order confirmed — PIV HQ</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-W63FKR42GV"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-W63FKR42GV', { page_path: '/success', page_title: 'Order Confirmed' });

    /* Read sku + price from URL: ?sku=band-18&value=29.99 */
    (function() {
      var p = new URLSearchParams(window.location.search);
      var sku   = p.get('sku')   || 'unknown';
      var value = parseFloat(p.get('value') || '0');
      gtag('event', 'purchase', {
        transaction_id: sku + '_' + Date.now(),
        value: value,
        currency: 'USD',
        items: [{ item_id: sku, price: value, quantity: 1 }]
      });
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #ffffff; --surface: #f7f6f3; --border: #e0ddd8; --txt: #111111; --txt-2: #555555; --txt-m: #999999; }
    body { background: var(--bg); color: var(--txt); font-family: 'Inter', sans-serif; font-size: 16px; line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; opacity: 0; animation: fadeIn 400ms ease forwards; }
    @keyframes fadeIn { to { opacity: 1; } }
    header { border-bottom: 1px solid var(--border); }
    .header-inner { max-width: 1000px; margin: 0 auto; padding: 0 32px; height: 64px; display: flex; align-items: center; }
    .logo { font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 4px; text-transform: uppercase; color: var(--txt); text-decoration: none; border: 1.5px solid var(--txt); padding: 6px 12px; }
    .main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 64px 32px; }
    .card { max-width: 480px; width: 100%; border: 1.5px solid var(--border); padding: 48px; }
    .check { font-size: 28px; margin-bottom: 24px; }
    .title { font-family: 'DM Mono', monospace; font-size: 24px; margin-bottom: 12px; }
    .body { font-size: 15px; font-weight: 300; color: var(--txt-2); line-height: 1.8; margin-bottom: 32px; }
    .back { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--txt-m); text-decoration: none; }
    .back:hover { color: var(--txt); }
    @media (max-width: 640px) { .card { padding: 32px 24px; } .header-inner { padding: 0 20px; } }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="/" class="logo">PIV</a>
    </div>
  </header>
  <main class="main">
    <div class="card">
      <div class="check">&#10003;</div>
      <h1 class="title">Order confirmed.</h1>
      <p class="body">Thanks for your order. You'll receive a confirmation email from Stripe shortly. Your order ships within the timeframe shown at checkout.</p>
      <a href="/" class="back">&#8592; Back to PIV HQ</a>
    </div>
  </main>
</body>
</html>
