<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logo Options — PIV</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #faf9f6;
      font-family: 'IBM Plex Sans', sans-serif;
      padding: 60px 40px;
      display: flex;
      flex-direction: column;
      gap: 64px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 48px;
    }

    .label {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 3px;
      color: #aaa;
      text-transform: uppercase;
      width: 80px;
      flex-shrink: 0;
    }

    .variants {
      display: flex;
      align-items: center;
      gap: 40px;
      flex-wrap: wrap;
    }

    .on-dark {
      background: #111;
      padding: 20px 28px;
      border-radius: 2px;
    }

    /* ── B1: Tight square border ── */
    .b1 {
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 4px;
      color: #111;
      border: 1.5px solid #111;
      padding: 7px 14px;
      text-transform: uppercase;
    }
    .b1.inv { color: #fff; border-color: #fff; }

    /* ── B2: Bracketed ── */
    .b2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 6px;
      color: #111;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .b2 .bracket {
      font-weight: 300;
      font-size: 28px;
      color: #999;
      line-height: 1;
    }
    .b2.inv { color: #fff; }
    .b2.inv .bracket { color: #555; }

    /* ── B3: Outlined circle stamp ── */
    .b3 {
      width: 68px;
      height: 68px;
      border: 1.5px solid #111;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .b3 span {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 3px;
      color: #111;
    }
    .b3.inv { border-color: #fff; }
    .b3.inv span { color: #fff; }

    /* ── B4: Serif inside ruled lines ── */
    .b4 {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .b4 .rule { width: 52px; height: 1px; background: #111; }
    .b4 .text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 10px;
      color: #111;
      padding: 0 4px;
    }
    .b4.inv .rule { background: #fff; }
    .b4.inv .text { color: #fff; }

    /* ── B5: Tag/pill with corner cuts ── */
    .b5 {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 5px;
      color: #111;
      border: 1.5px solid #111;
      padding: 8px 18px;
      clip-path: polygon(6px 0%, calc(100% - 6px) 0%, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0% calc(100% - 6px), 0% 6px);
    }
    .b5.inv { color: #fff; border-color: #fff; }

    /* ── B6: Monogram stacked ── */
    .b6 {
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1.5px solid #111;
      padding: 10px 18px;
      gap: 3px;
    }
    .b6 .main {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 300;
      letter-spacing: 8px;
      color: #111;
      line-height: 1;
    }
    .b6 .sub {
      font-family: 'DM Mono', monospace;
      font-size: 7px;
      letter-spacing: 4px;
      color: #999;
      text-transform: uppercase;
    }
    .b6.inv { border-color: #fff; }
    .b6.inv .main { color: #fff; }
    .b6.inv .sub { color: #666; }

    .divider {
      height: 1px;
      background: #e8e4de;
    }
  </style>
</head>
<body>

  <!-- B1 -->
  <div class="row">
    <div class="label">B1<br>Mono box</div>
    <div class="variants">
      <span class="b1">PIV</span>
      <div class="on-dark"><span class="b1 inv">PIV</span></div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- B2 -->
  <div class="row">
    <div class="label">B2<br>Bracketed serif</div>
    <div class="variants">
      <span class="b2"><span class="bracket">[</span>PIV<span class="bracket">]</span></span>
      <div class="on-dark"><span class="b2 inv"><span class="bracket">[</span>PIV<span class="bracket">]</span></span></div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- B3 -->
  <div class="row">
    <div class="label">B3<br>Circle stamp</div>
    <div class="variants">
      <div class="b3"><span>PIV</span></div>
      <div class="on-dark"><div class="b3 inv"><span>PIV</span></div></div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- B4 -->
  <div class="row">
    <div class="label">B4<br>Ruled serif</div>
    <div class="variants">
      <div class="b4">
        <div class="rule"></div>
        <div class="text">PIV</div>
        <div class="rule"></div>
      </div>
      <div class="on-dark">
        <div class="b4 inv">
          <div class="rule"></div>
          <div class="text">PIV</div>
          <div class="rule"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- B5 -->
  <div class="row">
    <div class="label">B5<br>Corner-cut tag</div>
    <div class="variants">
      <span class="b5">PIV</span>
      <div class="on-dark"><span class="b5 inv">PIV</span></div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- B6 -->
  <div class="row">
    <div class="label">B6<br>Stacked badge</div>
    <div class="variants">
      <div class="b6">
        <div class="main">PIV</div>
        <div class="sub">Retrofit Studio</div>
      </div>
      <div class="on-dark">
        <div class="b6 inv">
          <div class="main">PIV</div>
          <div class="sub">Retrofit Studio</div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
